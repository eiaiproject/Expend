    <title>Expend — Private, Local-First Personal Finance</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Expend",
      "description": "Track expenses, manage wallets, and monitor debts without creating an account. Data stays on your device. Works offline.",
      "url": "https://expend.pages.dev/",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Any (Web)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Local-first expense tracking",
        "Multi-wallet management",
        "Budget per category",
        "Debt and receivable tracking",
        "Offline functionality",
        "No account required"
      ],
      "softwareHelp": {
        "@type": "CreativeWork",
        "url": "https://github.com/eiaiproject/Expend.git"
      },
      "BrowserRequires": "JavaScript",
      "permissions": "offline"
    }
    </script>
    <link rel="icon" type="image/png" href="/icons/app-icons/icon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet" />
    <style>
      body {
        background-color: #1A1E16;
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .font-display {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        background-color: #7A9B6A;
        display: flex;
        flex-direction: column;
        align-items: center; /* NOSONAR S7924 */
        justify-content: center; /* NOSONAR S7924 */
        z-index: 9999;
        color: white;  /* NOSONAR css:S7924 */
        transition: opacity 0.4s ease-out;
      }
      .loader {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin-top: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <h1 style="font-size: 32px; font-weight: 700; letter-spacing: -0.01em; margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;">Expend</h1>
      <div class="loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
