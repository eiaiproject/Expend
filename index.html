    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Expend",
        "description": "Pencatat pengeluaran pribadi lewat chat dan bukti transfer. Data tersimpan di perangkat.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Memerlukan JavaScript dan IndexedDB.",

        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "IDR"
        },
        "featureList": [
          "Catat pengeluaran lewat chat",
          "Impor bukti transfer dari enam bank",
          "Pencarian dan filter transaksi",
          "Dasbor pengeluaran bulanan",
          "Ekspor CSV",
          "Data tersimpan di perangkat"
        ]
      }
    </script>
    <script>
      try {
        var saved = localStorage.getItem('expend-theme')
        var dark =
          saved === 'dark' ||
          (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').content = dark
          ? '#111110'
          : '#F4F2ED'
        if (saved === 'light' || saved === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = saved
        }
      } catch (error) {}
    </script>
