<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Expend is a privacy-first, offline-first personal finance tracker PWA for expenses, budgets, wallets, debt tracking, receivables, reports, and local-first data control." />
    <meta name="keywords" content="personal finance tracker, expense tracker, budget tracker, wallet manager, debt tracker, receivable tracker, offline-first PWA, privacy-first finance app, local-first finance app" />
    <meta name="application-name" content="Expend" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0F766E" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Expend | Privacy-First Offline Personal Finance Tracker PWA" />
    <meta property="og:description" content="Track expenses, budgets, wallets, debts, receivables, and monthly reports with local-first IndexedDB storage and offline PWA support." />
    <meta property="og:image" content="/icons/app-icons/icon-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Expend | Privacy-First Offline Personal Finance Tracker PWA" />
    <meta name="twitter:description" content="A local-first expense, budget, wallet, debt, receivable, and report tracker built as an offline PWA." />
    <meta name="twitter:image" content="/icons/app-icons/icon-512x512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Expend" />
    <link rel="apple-touch-icon" href="/icons/app-icons/icon-180x180.png" />
    <link rel="apple-touch-startup-image" href="/icons/app-icons/icon-512x512.png" />
    <title>Expend | Privacy-First Offline Personal Finance Tracker PWA</title>
    <link rel="icon" type="image/png" href="/icons/app-icons/icon-32x32.png" />
    <style>
      body {
        background-color: #0F172A;
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        background-color: #0F766E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        transition: opacity 0.5s ease-out;
      }
      .loader {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 1s ease-in-out infinite;
        margin-top: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <h1 style="font-size: 32px; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; margin: 0;">Expend</h1>
      <div class="loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
