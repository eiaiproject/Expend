name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci  # NOSONAR githubactions:S6505

      - name: Install Playwright Browsers
        # Required so the playwright E2E step can actually launch browsers.
        run: npx playwright install --with-deps chromium  # NOSONAR githubactions:S6505, S8543

      - name: Run QA Automated
        # Runs: strict lint, typecheck, i18n key check, unit tests, production build, and E2E (chromium).
        # `vite preview` is invoked by Playwright's webServer.command.
        run: npm run qa:automated

      - name: Generate Coverage Report
        # Produces coverage/lcov.info consumed by the Sonar scan below.
        run: npm run test:unit -- --coverage

      - name: SonarQube Scan
        # SonarCloud analyzes every push to a PR and decorates it with the
        # Quality Gate check + summary comment. Skipped until the
        # SONAR_TOKEN secret is configured in the repository.
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Run Lighthouse CI
        if: success()
        uses: treosh/lighthouse-ci-action@v12  # NOSONAR githubactions:S7637
        with:
          urls: |
            http://localhost:4173/
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        # Step ini hanya berjalan jika job quality-gate berhasil dan berada di branch main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: cloudflare/pages-action@v1  # NOSONAR githubactions:S7637
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: expend
          directory: dist
