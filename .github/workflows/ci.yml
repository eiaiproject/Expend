name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      # test:coverage menjalankan seluruh unit test sekaligus menghasilkan
      # coverage/lcov.info (dirujuk sonar-project.properties).
      - run: npm run test:coverage
      - run: npm run build
  e2e:
    # Terpisah dari `ci` agar kegagalan E2E terbaca jelas, tetapi tetap
    # menggating deploy (lihat `needs` di job deploy). Ini mencegah spec E2E
    # basi lolos seperti sebelumnya.
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      # Dev server yang dipakai Playwright harus punya aset OCR lokal, kalau tidak
      # spec ocr-offline-assets di-skip dan ketergantungan ke CDN lolos diam-diam.
      - run: npm run vendor:ocr
      # Biner browser jarang berubah: cache menghemat ~40-60 s tiap run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # Proyek `mobile` (Pixel 5) juga berbasis chromium, jadi cukup chromium + webkit.
      # Biner lokal (bukan npx on-demand) agar tak memicu S6505/S8543.
      - run: ./node_modules/.bin/playwright install --with-deps chromium webkit
      # CI=true otomatis dari GitHub Actions -> playwright.config memakai
      # retries 2 dan 1 worker, sehingga flaky sesekali tidak memblokir rilis.
      - run: ./node_modules/.bin/playwright test
  release:
    # Rilis berjalan di run yang sama setelah seluruh test hijau, bukan lewat
    # `workflow_run` terpisah: tidak ada suite yang dijalankan dua kali, tidak
    # ada kode dari konteks luar yang di-checkout di workflow ber-privilese
    # (Sonar S7631), dan tidak ada tag rilis kalau CI merah.
    needs: [ci, e2e]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
  deploy:
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build
      # pages-action dihapus upstream (repo 404) -> deploy via wrangler-action.
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=expend
