name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        # Required so the playwright E2E step can actually launch browsers.
        run: npx playwright install --with-deps chromium

      - name: Run QA Automated
        # Runs: strict lint, typecheck, i18n key check, unit tests, production build, and E2E (chromium).
        # `vite preview` is invoked by Playwright's webServer.command.
        run: npm run qa:automated

      - name: Run Lighthouse CI
        if: success()
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Audit Dependencies
        run: npm run audit

      - name: Deploy to Cloudflare Pages
        # Only deploys on main branch pushes when all prior quality checks passed.
        # Deploy failure is NOT silently ignored — if the deploy fails the job fails.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: expend
          directory: dist
