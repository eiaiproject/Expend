sonar.organization=eiaiproject
sonar.projectKey=eiaiproject_Expend
sonar.projectName=Expend

# Sources
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**

# Copy-paste detection: moreSections.ts is pure declarative data whose repeated
# section/link shapes trip CPD structurally; it is excluded so the duplication
# metric reflects real code duplication only.
sonar.cpd.exclusions=src/components/moreSections.ts

# Tests
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Language & JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=4096

# Encoding
sonar.sourceEncoding=UTF-8
