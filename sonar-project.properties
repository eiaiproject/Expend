sonar.organization=eiaiproject
sonar.projectKey=eiaiproject_Expend
sonar.projectName=Expend

# Sources
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/tests/**

# Tests
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Language & JavaScript/TypeScript settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=4096

# Encoding
sonar.sourceEncoding=UTF-8
