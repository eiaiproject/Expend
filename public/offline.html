<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <title>Expend — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background-color: #0F172A;
      color: #E2E8F0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background-color: #0F766E;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 36px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.05em;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #F8FAFC;
    }
    .subtitle {
      font-size: 16px;
      color: #94A3B8;
      margin-bottom: 32px;
      max-width: 360px;
      line-height: 1.5;
    }
    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      background-color: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: #FBBF24;
      font-size: 13px;
      font-weight: 500;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #FBBF24;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .tip {
      margin-top: 32px;
      padding: 16px;
      border-radius: 12px;
      background-color: rgba(15, 118, 110, 0.1);
      border: 1px solid rgba(15, 118, 110, 0.2);
      max-width: 360px;
      text-align: left;
    }
    .tip-title {
      font-size: 13px;
      font-weight: 600;
      color: #2DD4BF;
      margin-bottom: 4px;
    }
    .tip-text {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
    }
    button {
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 12px;
      border: none;
      background-color: #0F766E;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #115E59;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="icon">E</div>
  <h1>You're Offline</h1>
  <p class="subtitle">
    No internet connection detected. If this device has opened Expend before, your local data can still be used here.
  </p>
  <div class="status-bar">
    <span class="status-dot"></span>
    Offline Mode
  </div>
  <div class="tip">
    <div class="tip-title">Local-first data</div>
    <div class="tip-text">
      Expend stores financial data in this browser on this device.
      Changes made offline are not synced to a cloud service automatically.
    </div>
  </div>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
