# SonarQube Cloud Automatic Analysis configuration.
#
# This project is analyzed via SonarCloud Automatic Analysis (GitHub App),
# which IGNORES sonar-project.properties. Only this file (on the default
# branch) and the project Administration UI settings are honored.
# Wildcard patterns are not allowed in this file.
#
# Copy-paste detection: moreSections.ts is pure declarative data whose repeated
# section/link shapes trip CPD structurally; it is excluded so the duplication
# metric reflects real code duplication only.
sonar.cpd.exclusions=src/components/moreSections.ts

# Exclude ui-audit/ tooling from analysis — dev probes, repro scripts, and
# ephemeral screenshot captures. They are not shipped code and the quality
# gate should reflect the app, not audit harness.
# NOTE: Automatic Analysis requires one exclusion per path, no wildcards.
sonar.exclusions=ui-audit/audit.mjs,ui-audit/verify.mjs,ui-audit/contrast-check.mjs,ui-audit/clip-probe.mjs,ui-audit/repro-payee-link.mjs,ui-audit/out
