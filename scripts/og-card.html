<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Expend - og-image generator (1200x630)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    background: #1a2d19;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(221,203,183,0.14), transparent 60%),
      radial-gradient(700px 500px at 105% 110%, rgba(221,203,183,0.08), transparent 55%),
      linear-gradient(135deg, #1a2d19 0%, #264025 70%, #2c4a2b 100%);
    display: flex; align-items: center;
    padding: 64px 72px; gap: 56px;
  }
  .frame { position: absolute; inset: 22px; border: 2px solid rgba(221,203,183,0.35); border-radius: 28px; pointer-events: none; }
  .left { flex: 1; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 72px; height: 64px; border-radius: 16px; }
  .brand .name { color: #ddcbb7; font-size: 30px; font-weight: 800; letter-spacing: 6px; }
  h1 { color: #F7F6F2; font-size: 68px; line-height: 1.04; font-weight: 800; letter-spacing: -1.5px; margin-top: 28px; }
  h1 .tan { color: #ddcbb7; }
  .sub { color: rgba(247,246,242,0.72); font-size: 25px; line-height: 1.45; margin-top: 20px; max-width: 560px; }
  .sub b { color: #F7F6F2; }
  .pills { display: flex; gap: 12px; margin-top: 30px; }
  .pill {
    color: #ddcbb7; border: 1.5px solid rgba(221,203,183,0.5); border-radius: 999px;
    font-size: 20px; font-weight: 700; padding: 10px 22px; letter-spacing: 0.3px;
  }
  .url { position: absolute; left: 72px; bottom: 44px; color: rgba(221,203,183,0.6); font-size: 20px; font-weight: 600; letter-spacing: 1px; }
  .phone {
    width: 400px; flex-shrink: 0; background: #F7F6F2; border-radius: 30px;
    padding: 26px 24px; box-shadow: 0 32px 80px rgba(0,0,0,0.45);
  }
  .phone .head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .phone .head img { width: 44px; height: 44px; border-radius: 10px; }
  .phone .head .t1 { font-size: 21px; font-weight: 800; color: #1A1A1A; }
  .phone .head .t2 { font-size: 15px; color: #6b6962; }
  .bub { max-width: 82%; padding: 13px 18px; font-size: 20px; line-height: 1.35; border-radius: 20px; }
  .bub.user { background: #264025; color: #ddcbb7; margin-left: auto; border-bottom-right-radius: 8px; font-weight: 600; }
  .bub.ai { background: #fff; color: #1A1A1A; border: 1.5px solid #EBE9E4; border-bottom-left-radius: 8px; margin-top: 12px; }
  .bub.ai b { font-weight: 800; }
  .total {
    margin-top: 16px; background: #264025; border-radius: 18px; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .total .k { color: rgba(221,203,183,0.75); font-size: 15px; font-weight: 600; }
  .total .v { color: #ddcbb7; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>
    <div class="left">
      <div class="brand">
        <img src="../public/Expend-logo.svg" alt="" />
        <div class="name">EXPEND</div>
      </div>
      <h1>Catat pengeluaran<br /><span class="tan">semudah chat.</span></h1>
      <p class="sub">Ketik <b>“kopi 20rb”</b> atau foto struk - <b>100% offline</b>, data tetap di perangkatmu.</p>
      <div class="pills">
        <div class="pill">100% Offline</div>
        <div class="pill">Tanpa daftar</div>
        <div class="pill">Gratis</div>
      </div>
    </div>
    <div class="phone">
      <div class="head">
        <img src="../public/Expend-logo.svg" alt="" />
        <div>
          <div class="t1">Catat pengeluaran</div>
          <div class="t2">Ketik transaksi atau unggah bukti</div>
        </div>
      </div>
      <div class="bub user">kopi 20rb dari kas</div>
      <div class="bub ai"><b>Tercatat · Rp20.000</b></div>
      <div class="total">
        <div class="k">September</div>
        <div class="v">Rp1.550.000</div>
      </div>
    </div>
    <div class="url">expend.pages.dev</div>
  </div>
</body>
</html>
